events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        # ACME HTTP-01 challenge, served from a host-mounted webroot. The shared
        # edge proxy forwards /.well-known/acme-challenge/ here, so certbot can
        # issue and renew TLS without ever restarting nginx-proxy (which fronts
        # darkfall and must not go down).
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            try_files $uri =404;
        }

        # Content-hashed build assets — immutable, cache hard.
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # SPA: serve the file if it exists, else hand routing to index.html.
        location / {
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
