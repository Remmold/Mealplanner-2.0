name: Deploy to VM

# Build the two images on GitHub's runners, push to GHCR, then SSH to the VM and
# pull + swap. This keeps the 1GB VM (which also hosts darkfall) from being
# saturated by Docker builds — deploys become a few-second image swap instead of
# pinning the box for minutes.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-vm
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/remmold/mealplanner-backend:latest
  FRONTEND_IMAGE: ghcr.io/remmold/mealplanner-frontend:latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Write frontend env (Vite inlines VITE_* at build time)
        run: |
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' \
            '${{ secrets.VITE_SUPABASE_URL }}' '${{ secrets.VITE_SUPABASE_ANON_KEY }}' > frontend/.env

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (pull + swap, no build on the VM)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 10m
          script_stop: true
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd ~/mealplanner
            git fetch origin main
            git reset --hard origin/main
            docker-compose pull
            docker-compose up -d --no-build
            # The backend gets a fresh IP on recreate; nginx-proxy caches the old
            # one, so re-resolve it (graceful reload, no darkfall impact).
            docker exec nginx-proxy nginx -s reload || true
            docker image prune -f
            docker logout ghcr.io
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
